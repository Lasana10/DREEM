name: DREEM Supabase credential verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dreem-supabase-credential-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_PROJECT: vlukkucwtfmfgpzvjyvd
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DREEM_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
      HAS_DB_PASSWORD: ${{ secrets.DREEM_SUPABASE_DB_PASSWORD != '' || secrets.SUPABASE_DB_PASSWORD != '' }}
      HAS_TURNSTILE: ${{ secrets.DREEM_TURNSTILE_SECRET_KEY != '' || secrets.TURNSTILE_SECRET_KEY != '' }}
    steps:
      - name: Verify secret availability without disclosing values
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Supabase management token: available to this GitHub workflow"
          else
            echo "::warning::No accessible DREEM_SUPABASE_ACCESS_TOKEN or SUPABASE_ACCESS_TOKEN"
          fi
          echo "Database password configured: $HAS_DB_PASSWORD"
          echo "Turnstile secret configured: $HAS_TURNSTILE"
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: Confirm token authorizes only correct DREEM project
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          set -euo pipefail
          supabase projects list --output json > /tmp/dreem-projects.json
          python3 - <<'PY'
          import json,os,sys
          with open('/tmp/dreem-projects.json',encoding='utf8') as f:
              projects=json.load(f)
          if isinstance(projects,dict):
              projects=projects.get('projects',[])
          target=os.environ['EXPECTED_PROJECT']
          if any(isinstance(p,dict) and (p.get('id')==target or p.get('ref')==target) for p in projects):
              print('Confirmed: GitHub token can access authorised DREEM Supabase project '+target)
          else:
              print('DREEM project NOT accessible with the GitHub token. No database operation attempted.')
              sys.exit(1)
          PY
