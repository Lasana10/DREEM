name: DREEM production access preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dreem-production-access-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      EXPECTED_REF: vlukkucwtfmfgpzvjyvd
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DREEM_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_PERSONAL_ACCESS_TOKEN }}
      DB_PASSWORD: ${{ secrets.DREEM_SUPABASE_DB_PASSWORD || secrets.SUPABASE_DB_PASSWORD }}
      DATABASE_URL: ${{ secrets.DREEM_DATABASE_URL || secrets.SUPABASE_DATABASE_URL || secrets.DATABASE_URL }}
      HAS_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' || secrets.DREEM_SUPABASE_SERVICE_ROLE_KEY != '' }}
      HAS_TURNSTILE: ${{ secrets.TURNSTILE_SECRET_KEY != '' || secrets.DREEM_TURNSTILE_SECRET_KEY != '' }}
    steps:
      - name: Inspect authorised capability without displaying secrets
        run: |
          set -euo pipefail
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then echo "Management token: present"; else echo "Management token: not exposed to this job"; fi
          if [ -n "$DB_PASSWORD" ]; then echo "Database password: present"; else echo "Database password: not exposed to this job"; fi
          if [ -n "$DATABASE_URL" ]; then echo "Direct database URL: present"; else echo "Direct database URL: not exposed to this job"; fi
          echo "Service role key configured: $HAS_SERVICE_ROLE"
          echo "Turnstile secret configured: $HAS_TURNSTILE"
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: Verify exact Supabase project with existing token
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          set -euo pipefail
          supabase projects list --output json > "$RUNNER_TEMP/dreem-projects.json"
          python3 - <<'PY'
          import json, os, sys
          with open(os.environ["RUNNER_TEMP"]+"/dreem-projects.json") as f:
            projects=json.load(f)
          if isinstance(projects, dict): projects=projects.get("projects", [])
          ok=any(isinstance(p,dict) and (p.get("id")==os.environ["EXPECTED_REF"] or p.get("ref")==os.environ["EXPECTED_REF"]) for p in projects)
          print("Existing GitHub token access to correct DREEM project:", "YES" if ok else "NO")
          if not ok: sys.exit(1)
          PY
      - name: Check whether existing direct database URL targets DREEM
        if: env.DATABASE_URL != ''
        run: |
          case "$DATABASE_URL" in
            *"$EXPECTED_REF"*) echo "Direct DB URL references DREEM project: YES" ;;
            *) echo "::error::Direct DB URL cannot be proven to belong to DREEM; refusing connection"; exit 1 ;;
          esac
      - name: Explain capability status
        if: always()
        run: |
          echo "Read-only preflight only. No migration, secret, function, hosting or data changes made."
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ -z "$DATABASE_URL" ]; then echo "::warning::No privileged database deployment connection available to this GitHub job. Browser publishable key alone cannot deploy SQL."; fi
  protected-environment-credentials:
    runs-on: ubuntu-latest
    environment: dreem-production
    timeout-minutes: 7
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DREEM_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
      DB_PASSWORD: ${{ secrets.DREEM_SUPABASE_DB_PASSWORD || secrets.SUPABASE_DB_PASSWORD }}
      DATABASE_URL: ${{ secrets.DREEM_DATABASE_URL || secrets.SUPABASE_DATABASE_URL || secrets.DATABASE_URL }}
      HAS_TURNSTILE: ${{ secrets.DREEM_TURNSTILE_SECRET_KEY != '' || secrets.TURNSTILE_SECRET_KEY != '' }}
    steps:
      - name: Inspect existing protected environment secret availability only
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then echo "Protected environment management token: present"; else echo "Protected environment management token: not exposed"; fi
          if [ -n "$DB_PASSWORD" ]; then echo "Protected environment DB password: present"; else echo "Protected environment DB password: not exposed"; fi
          if [ -n "$DATABASE_URL" ]; then echo "Protected environment DB connection URL: present"; else echo "Protected environment DB connection URL: not exposed"; fi
          echo "Protected environment Turnstile secret configured: $HAS_TURNSTILE"
